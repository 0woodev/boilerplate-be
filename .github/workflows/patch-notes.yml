name: Patch Notes Sync

# ACTIVITY.md → PatchNote 멱등 동기화 + L2 LLM body 초안 생성.
# 수동 실행(workflow_dispatch)이 기본. ACTIVITY.md 변경 push 시 자동 동기화도 선택 가능.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'L2 LLM provider (anthropic|openai)'
        required: false
        default: 'anthropic'
      model:
        description: 'L2 모델 ID (미설정 시 provider 기본값)'
        required: false
        default: ''
  push:
    branches: [dev, main]
    paths:
      - 'ACTIVITY.md'

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      STAGE: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      # 선택된 provider 의 키만 있으면 동작. 존재하는 secret 만 전달된다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PATCH_NOTES_PROVIDER: ${{ inputs.provider || 'anthropic' }}
      PATCH_NOTES_MODEL: ${{ inputs.model || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-${{ env.STAGE }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt -q

      # ACTIVITY.md 는 루트 레포 소유. submodule 단독 체크아웃에는 없으므로
      # 존재할 때만 동기화한다(기본 경로 ../ACTIVITY.md).
      - name: Sync patch notes (L1 + L2 LLM draft)
        run: |
          if [ -f ../ACTIVITY.md ]; then
            python scripts/generate_patch_notes.py --llm
          else
            echo "⏭️  ../ACTIVITY.md not found — skipping."
          fi
